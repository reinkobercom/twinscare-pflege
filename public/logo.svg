    <!-- adult figures forming a protective heart -->
    <circle class="navy" cx="126" cy="205" r="31"/>
    <circle class="red" cx="347" cy="205" r="31"/>
    <path class="navy" d="M49 282 C49 244 78 229 126 229 C160 229 190 245 213 276 C183 261 151 260 131 274 C108 290 112 329 129 360 C147 393 179 416 195 430 L181 430 C112 393 49 341 49 282Z"/>
    <path class="red" d="M424 282 C424 244 395 229 347 229 C313 229 283 245 260 276 C290 261 322 260 342 274 C365 290 361 329 344 360 C326 393 294 416 278 430 L292 430 C361 393 424 341 424 282Z"/>
    <!-- central child -->
    <circle class="navy" cx="237" cy="316" r="25"/>
    <path class="navy" d="M177 328 C194 347 214 357 237 357 C260 357 280 347 297 328 C302 322 311 328 307 336 C295 359 277 374 258 381 L258 421 L237 438 L216 421 L216 381 C197 374 179 359 167 336 C163 328 172 322 177 328Z"/>
  </g>
  <!-- divider -->
  <rect x="520" y="96" width="7" height="270" class="navy"/>
  <!-- wordmark -->
  <text x="575" y="267" class="word" font-size="184"><tspan class="navy">Twins</tspan><tspan class="red">Care</tspan></text>
  <text x="580" y="335" class="sub navy" font-size="49">Ambulanter Pflegedienst GmbH &amp; Co. KG</text>
</svg>

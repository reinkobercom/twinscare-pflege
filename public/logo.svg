<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">TwinsCare – Ambulanter Pflegedienst</title>
  <desc id="desc">Modernes Logo in Dunkelblau und Rot mit Haus- und Familiensymbol sowie Wortmarke TwinsCare.</desc>
